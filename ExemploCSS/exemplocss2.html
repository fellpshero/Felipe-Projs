<html>
    <head>
        <title> Exemplo CSS</title>
        <!-- estabelece a ligação com o arquivo CSS -->
        <link href="estilos.css" type="text/css" rel="stylesheet"  />
    </head>
    <body>
        <!-- css inline -->
        <p style="font-size: 48px; color: brown;"> Fatec Mococa </p>
        <p style="font-size: 48pt; color: blue;"> Fatec Mococa </p>

        <!-- seletor de TAG -->
        <p> Fatec Mococa </p>

        <!-- seletor de classe -->
        <p class="paragrafo"> Fatec Mococa </p>

        <!-- seletor de ID -->
        <p id="Texto"> Fatec Mococa </p>

        <!-- seletor de ATRIBUTOS -->
        Digite seu nome: <input id="nome" value="Maicon" type="text" /> 


    </body>
</html>
