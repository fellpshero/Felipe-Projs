        <h1> Tabela 3</h1>

            <tr> <!-- inicio da linha table row -->

                    L1 C1
                </td> <!-- table data -->

                    L1 C2
                </td> <!-- table data -->
                <td rowspan="2"> <!-- table data -->

                </td> <!-- table data -->
            </tr> <!-- fim da linha table row -->
